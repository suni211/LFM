name: FM 2026 pro performance evaluation data
on:
  push:
    branches:
      - fix/fm-unified-nationality-2026-11-08
    paths:
      - 'rift-native/tools/import_pro_performance.py'
      - '.github/workflows/fm-pro-performance.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  recorded-matches:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install csv analysis packages
        run: python -m pip install pandas
      - name: Calculate 2026 pro game performance
        run: python -u rift-native/tools/import_pro_performance.py
      - name: Commit attributable player performance index
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add rift-native/assets/pro-performance-2026.json rift-native/pro-performance-2026-report.json
          if ! git diff --staged --quiet; then
            git commit -m 'Refresh individually matched 2026 pro match performance estimates'
            git fetch origin fix/fm-unified-nationality-2026-11-08
            git rebase origin/fix/fm-unified-nationality-2026-11-08
            git push origin HEAD:fix/fm-unified-nationality-2026-11-08
          fi
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: fm-2026-pro-performance-report
          path: rift-native/pro-performance-2026-report.json
          if-no-files-found: ignore
